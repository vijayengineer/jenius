<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#141428" />
    <title>Offline — Jenius</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #141428;
        color: #f7f7ff;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: 2rem;
        margin: 0 0 0.75rem;
      }
      p {
        color: #b9b7c8;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.75rem 1.25rem;
        border-radius: 1rem;
        color: white;
        background: linear-gradient(135deg, #5d9cff, #a04ed8);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>
        Previously loaded Jenius lessons and progress remain on this device. Reopen the feed or
        reconnect to refresh the application shell.
      </p>
      <a href="/">Open the feed</a>
    </main>
  </body>
</html>
